# Splitting windows
bind-key -T prefix s split-window -h -c "#{pane_current_path}"
bind-key -T prefix S split-window -v -c "#{pane_current_path}"

# Creating new window
bind-key -T prefix c new-window

# Rename Window
bind-key -T prefix \; command-prompt -I "#W" { rename-window "%%" }

# Rename Session
bind-key -T prefix , command-prompt -I "#S" { rename-session "%%" }

# Creating Session
bind-key -T prefix - command-prompt -I "#S" { new-session -s "%%" }

# Move through sessions
bind-key -r -T prefix ) switch-client -n
bind-key -r -T prefix ( switch-client -p

# List sessions
bind-key -T prefix \{ list-sessions

# Delete session
bind-key -T prefix \} confirm-before -p "kill-session #W? (y/n)" kill-session

# Moving through windows
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

bind-key -r -T prefix C-h select-pane -L
bind-key -r -T prefix C-j select-pane -D
bind-key -r -T prefix C-k select-pane -U
bind-key -r -T prefix C-l select-pane -R

bind-key -T prefix n next-window
bind-key -T prefix p previous-window
bind-key -T prefix d detach-client

bind-key -T prefix 1 select-window -t :=1
bind-key -T prefix 2 select-window -t :=2
bind-key -T prefix 3 select-window -t :=3
bind-key -T prefix 4 select-window -t :=4
bind-key -T prefix 5 select-window -t :=5
bind-key -T prefix 6 select-window -t :=6
bind-key -T prefix 7 select-window -t :=7
bind-key -T prefix 8 select-window -t :=8
bind-key -T prefix 9 select-window -t :=9
bind-key -T prefix 0 select-window -t :=10

# Move window
bind-key -T prefix . command-prompt -T target { move-window -t "%%" }

# Resizing panes
bind-key -r -T prefix M-h resize-pane -L
bind-key -r -T prefix M-j resize-pane -D
bind-key -r -T prefix M-k resize-pane -U
bind-key -r -T prefix M-l resize-pane -R

# Maximize pane
bind-key -T prefix m resize-pane -Z

# Kill pane
bind-key -T prefix x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# List keys
bind-key -T prefix ? list-keys -N

# Kill Window
bind-key -T prefix C-c confirm-before -p "kill-window #W? (y/n)" kill-window

# Enter Command Mode
bind-key -T prefix : command-prompt

# Enter Copy Mode
bind-key -T prefix C-v copy-mode

# Copy Mode Movement
bind-key -T copy-mode h send-keys -X cursor-left
bind-key -T copy-mode j send-keys -X cursor-down
bind-key -T copy-mode k send-keys -X cursor-up
bind-key -T copy-mode l send-keys -X cursor-right

bind-key -T copy-mode w send-keys -X next-word-end
bind-key -T copy-mode b send-keys -X previous-word

bind-key -T copy-mode 0 send-keys -X start-of-line
bind-key -T copy-mode _ send-keys -X start-of-line
bind-key -T copy-mode $ send-keys -X end-of-line

bind-key -T copy-mode C-u send-keys -X page-up
bind-key -T copy-mode C-d send-keys -X page-down

bind-key -T copy-mode v send-keys -X begin-selection

bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel

bind-key -T copy-mode / command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental "%%" }
bind-key -T copy-mode n send-keys -X search-again
bind-key -T copy-mode N send-keys -X search-reverse


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'faqcyo/minimal-tmux-status'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin configs

# minimal-tmux-status

set -g @minimal-tmux-fg "#282C34"
set -g @minimal-tmux-bg "#98C379"
set -g @minimal-tmux-status top
set -g @minimal-tmux-status-left-extra "  #S"
set -g status-left-length 20



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

