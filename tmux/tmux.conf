# Unbind all the default keybindings
unbind-key -a

# Allow the mouse to control some parts of tmux
set -g mouse on 

# When killing session, don't detach
set-option -g detach-on-destroy off

# Set the prefix 
set-option -g prefix C-q
bind-key q send-prefix

# Window offset
set -g base-index 1
setw -g pane-base-index 1

# Status
set -g status-right "#{uptime}"
set -g status-fg "#ABB2BF"

set -g pane-border-style fg=colour107
set -g pane-active-border-style fg=colour179


