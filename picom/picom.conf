# --- Backend Settings ---
backend = "glx";
vsync = true;

# --- Performance & Compatibility Tweaks ---
use-damage = true;

# --- Disable Visual Overhead ---
shadow = false;
fading = false;
corner-radius = 0;
blur-background = false;

unredir-if-possible = false;


opacity-rule = [
  "85:class_g = 'Alacritty' && focused",
  "65:class_g = 'Alacritty' && !focused"
];
